<script>
    const rooms = [
        {
            name: "חדר 1: סטודיו הצילומים 📸",
            bg: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=600",
            hotspots: [
                {
                    top: "35%", left: "15%", width: "70px", height: "70px", icon: "💻",
                    title: "מחשב העריכה של הסטודיו",
                    // נגן וידאו מובנה יציב שעובד ב-100% בכל דפדפן
                    videoType: "iframe",
                    video: "https://www.youtube-nocookie.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=0&loop=1",
                    desc: "הביטו בסרטון הסטודיו שנפתח! הרמז שמופיע במסך: <br><br><b>'אני יכול לרוץ אבל אין לי רגליים, ויש לי ערוץ אבל אין לי טלוויזיה'. מי אני?</b>",
                    answers: ["נהר", "נחל", "מים"]
                },
                {
                    top: "60%", left: "65%", width: "80px", height: "80px", icon: "💡",
                    title: "תאורת הרינג-לייט",
                    desc: "על גב התאורה חרוט רמז: <br><br><b>'אני תמיד מולך אבל אף אחד לא יכול לראות אותי'. מה אני?</b>",
                    answers: ["עתיד", "העתיד"]
                }
            ]
        },
        {
            name: "חדר 2: ארון התלבושות 👗",
            bg: "https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=600",
            hotspots: [
                {
                    top: "45%", left: "40%", width: "90px", height: "90px", icon: "👟",
                    title: "קופסת נעלי הניאון",
                    desc: "בתוך הנעל מוחבאת פתקית: <br><br><b>'ככל שתיקח ממני יותר, ככה אהיה גדולה יותר'. מה אני?</b>",
                    answers: ["גומה", "חור", "הגומה"]
                }
            ]
        }
    ];

    let currentRoom = 0;
    let currentHotspot = null;

    function loadRoom() {
        const room = rooms[currentRoom];
        document.getElementById('room-header').innerText = room.name;
        const viewport = document.getElementById('room-viewport');
        viewport.style.backgroundImage = `url('${room.bg}')`;
        viewport.innerHTML = "";

        room.hotspots.forEach(hs => {
            const el = document.createElement('div');
            el.className = 'hotspot';
            el.style.top = hs.top;
            el.style.left = hs.left;
            el.style.width = hs.width;
            el.style.height = hs.height;
            el.innerHTML = hs.icon;
            el.onclick = () => openHotspot(hs);
            viewport.appendChild(el);
        });
    }

    function openHotspot(hs) {
        currentHotspot = hs;
        document.getElementById('p-title').innerText = hs.title;
        document.getElementById('p-desc').innerHTML = hs.desc;
        document.getElementById('ans-input').value = "";
        
        const videoBox = document.getElementById('video-box');
        if (hs.video) {
            videoBox.style.display = 'block';
            videoBox.innerHTML = `<iframe src="${hs.video}" style="width:100%; height:100%; border:none;" allow="autoplay"></iframe>`;
        } else {
            videoBox.style.display = 'none';
            videoBox.innerHTML = "";
        }

        document.getElementById('puzzle-modal').style.display = 'flex';
    }

    function closePuzzle() {
        document.getElementById('puzzle-modal').style.display = 'none';
        document.getElementById('video-box').innerHTML = ""; 
    }

    function checkAnswer() {
        const val = document.getElementById('ans-input').value.trim();
        if (currentHotspot.answers.some(a => val.includes(a))) {
            alert("פצחתן את החידה בחפץ הזה! 🏆");
            closePuzzle();
            
            currentRoom++;
            if (currentRoom < rooms.length) {
                loadRoom();
            } else {
                document.getElementById('room-viewport').style.display = 'none';
                document.getElementById('win-screen').style.display = 'flex';
            }
        } else {
            alert("תשובה שגויה, חפשו שוב בחפץ! 🤔");
        }
    }

    loadRoom();
</script>
