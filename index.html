<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אחוזת הטיקטוק - חדר בריחה מציאותי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tiktok-pink: #fe0979;
            --tiktok-cyan: #00f2fe;
        }
        body {
            background-color: #0d0d0d;
            font-family: 'Heebo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .phone-mockup {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 850px;
            background: #000;
            border-radius: 35px;
            border: 8px solid #222;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .header {
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            background: rgba(0,0,0,0.85);
            border-bottom: 2px solid var(--tiktok-pink);
            z-index: 10;
        }
        
        .room-viewport {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }

        .hotspot {
            position: absolute;
            border: 2px dashed var(--tiktok-cyan);
            background: rgba(0, 242, 254, 0.25);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            animation: pulse 2s infinite;
            transition: transform 0.2s;
        }
        .hotspot:active { transform: scale(0.9); }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px var(--tiktok-cyan); }
            50% { box-shadow: 0 0 20px var(--tiktok-pink); border-color: var(--tiktok-pink); }
            100% { box-shadow: 0 0 5px var(--tiktok-cyan); }
        }

        .puzzle-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.93);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 30;
        }
        .puzzle-box {
            background: #18181c;
            border: 2px solid var(--tiktok-pink);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            box-shadow: 0 0 25px rgba(254, 9, 121, 0.4);
            max-height: 80vh;
            overflow-y: auto;
        }
        .puzzle-title { font-size: 20px; font-weight: bold; color: var(--tiktok-cyan); margin-bottom: 10px; }
        .puzzle-desc { font-size: 16px; line-height: 1.4; margin-bottom: 15px; }
        
        .video-container {
            width: 100%;
            height: 190px;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--tiktok-cyan);
        }
        iframe { width: 100%; height: 100%; border: none; }

        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid var(--tiktok-cyan);
            text-align: center;
            outline: none;
            margin-bottom: 12px;
            font-family: 'Heebo', sans-serif;
            background: #222;
            color: white;
        }
        .btn {
            background: var(--tiktok-pink);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 4px;
        }
        .btn-close { background: #444; }

        .win-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #fe0979, #00f2fe);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="phone-mockup">
    <div class="header" id="room-header">טוען את האחוזה...</div>
    
    <div class="room-viewport" id="room-viewport"></div>

    <div class="puzzle-modal" id="puzzle-modal">
        <div class="puzzle-box">
            <div class="puzzle-title" id="p-title">חפץ שנמצא!</div>
            <div id="video-box" class="video-container" style="display:none;"></div>
            <div class="puzzle-desc" id="p-desc">תיאור החידה</div>
            
            <div id="input-area">
                <input type="text" id="ans-input" placeholder="הקלידו את התשובה...">
                <br>
                <button class="btn" onclick="checkAnswer()">פתיחת המנעול 🔓</button>
            </div>
            <br>
            <button class="btn btn-close" onclick="closePuzzle()">חזרה לסריקת החדר 🔍</button>
        </div>
    </div>

    <div class="win-screen" id="win-screen">
        <h1 style="font-size: 40px;">🎉 סיימתן את המשחק! 🎉</h1>
        <p style="font-size: 22px;">ליאור ומילי, פתרתן את כל החידות באחוזה כמו אלופות אמיתיות!</p>
        <div style="font-size: 70px;">👑📱✨</div>
    </div>
</div>

<script>
    const rooms = [
        {
            name: "חדר 1: סטודיו הצילומים 📸",
            bg: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=600",
            hotspots: [
                {
                    top: "35%", left: "15%", width: "70px", height: "70px", icon: "💻",
                    title: "מחשב העריכה של הסטודיו",
                    video: "https://www.youtube.com/embed/LtY23Aq1mTI?autoplay=1",
                    desc: "הלהיט של אנה זק מתנגן במחשב! <br><br><b>הקשיבו לשיר - מה מבקשת הזמרת מאותו בחור לעשות?</b>",
                    answers: ["לישון", "לך לישון"]
                },
                {
                    top: "60%", left: "65%", width: "80px", height: "80px", icon: "💡",
                    title: "תאורת הרינג-לייט",
                    video: null,
                    desc: "על גב התאורה חרוט רמז: <br><br><b>'אני תמיד מולך אבל אף אחד לא יכול לראות אותי'. מה אני?</b>",
                    answers: ["עתיד", "העתיד"]
                }
            ]
        },
        {
            name: "חדר 2: ארון התלבושות 👗",
            bg: "https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=600",
            hotspots: [
                {
                    top: "45%", left: "40%", width: "90px", height: "90px", icon: "👟",
                    title: "קופסת נעלי הניאון",
                    video: "https://www.youtube.com/embed/FsNW5wYnSYU",
                    desc: "מצאתן קלטת סודית עם שיר מוכר. <br><br><b>באיזה מופע ילדים מפורסם מדובר בשיר שמתנגן?</b>",
                    answers: ["פסטיגל", "הפסטיגל"]
                }
            ]
        },
        {
            name: "חדר 3: קולנוע הטיקטוק 🍿",
            bg: "https://images.unsplash.com/photo-1585647347384-2593bc35786b?w=600",
            hotspots: [
                {
                    top: "40%", left: "50%", width: "100px", height: "80px", icon: "📺",
                    title: "מסך הטלוויזיה הענק",
                    video: "https://www.youtube.com/embed/mYgxBtAoi50",
                    desc: "מסך הטלוויזיה נדלק על חידון סרטונים של דיסני! <br><br><b>איך קוראים ליצור החוצני הכחול והחמוד שמופיע בסרטון?</b>",
                    answers: ["סטיץ", "סטיץ'"]
                }
            ]
        }
    ];

    let currentRoom = 0;
    let currentHotspot = null;
    let solvedInRoom = 0;

    function loadRoom() {
        const room = rooms[currentRoom];
        document.getElementById('room-header').innerText = room.name;
        const viewport = document.getElementById('room-viewport');
        viewport.style.backgroundImage = `url('${room.bg}')`;
        viewport.innerHTML = "";
        solvedInRoom = 0;

        room.hotspots.forEach(hs => {
            const el = document.createElement('div');
            el.className = 'hotspot';
            el.style.top = hs.top;
            el.style.left = hs.left;
            el.style.width = hs.width;
            el.style.height = hs.height;
            el.innerHTML = hs.icon;
            el.onclick = () => openHotspot(hs, el);
            viewport.appendChild(el);
        });
    }

    function openHotspot(hs, element) {
        currentHotspot = hs;
        currentHotspot.element = element;
        document.getElementById('p-title').innerText = hs.title;
        document.getElementById('p-desc').innerHTML = hs.desc;
        document.getElementById('ans-input').value = "";
        
        const videoBox = document.getElementById('video-box');
        if (hs.video) {
            videoBox.style.display = 'block';
            videoBox.innerHTML = `<iframe src="${hs.video}" allow="autoplay; encrypted-media"></iframe>`;
        } else {
            videoBox.style.display = 'none';
            videoBox.innerHTML = "";
        }

        document.getElementById('puzzle-modal').style.display = 'flex';
    }

    function closePuzzle() {
        document.getElementById('puzzle-modal').style.display = 'none';
        document.getElementById('video-box').innerHTML = ""; 
    }

    function checkAnswer() {
        const val = document.getElementById('ans-input').value.trim();
        if (currentHotspot.answers.some(a => val.includes(a))) {
            alert("פצחתן את החידה בחפץ הזה! 🏆");
            closePuzzle();
            currentHotspot.element.style.display = 'none'; // מעלים את החפץ אחרי שפתרו אותו
            solvedInRoom++;
            
            // בודק אם פתרו את כל החפצים בחדר
            if (solvedInRoom >= rooms[currentRoom].hotspots.length) {
                alert("כל הכבוד! פתחתן את הדלת לחדר הבא! 🚪✨");
                currentRoom++;
                if (currentRoom < rooms.length) {
                    loadRoom();
                } else {
                    document.getElementById('room-viewport').style.display = 'none';
                    document.getElementById('win-screen').style.display = 'flex';
                }
            }
        } else {
            alert("תשובה שגויה, חפשו שוב בחפץ! 🤔");
        }
    }

    loadRoom();
</script>
</body>
</html>
