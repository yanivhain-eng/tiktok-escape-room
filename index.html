<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אחוזת הטיקטוק - חדר בריחה אינטראקטיבי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tiktok-pink: #fe0979;
            --tiktok-cyan: #00f2fe;
            --bg-dark: #121212;
        }
        body {
            background-color: #050505;
            font-family: 'Heebo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        .phone-mockup {
            width: 100%;
            max-width: 400px;
            height: 95vh;
            max-height: 850px;
            background: var(--bg-dark);
            border-radius: 40px;
            border: 8px solid #222;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .header {
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            background: rgba(0,0,0,0.8);
            border-bottom: 2px solid var(--tiktok-pink);
            z-index: 10;
        }
        
        /* תצוגת החדר הפיזי */
        .room-viewport {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
        }
        
        /* חפצים אינטראקטיביים בחדר שאפשר ללחוץ עליהם */
        .interactive-object {
            background: rgba(0,0,0,0.65);
            border: 3px solid var(--tiktok-cyan);
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px var(--tiktok-cyan);
            transition: all 0.3s transform;
            animation: pulse 2s infinite;
            text-align: center;
        }
        .interactive-object:active {
            transform: scale(0.9);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--tiktok-cyan); }
            50% { box-shadow: 0 0 25px var(--tiktok-pink); border-color: var(--tiktok-pink); }
            100% { box-shadow: 0 0 10px var(--tiktok-cyan); }
        }

        /* מודאל (חלון קופץ) של החידה */
        .puzzle-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            z-index: 20;
        }
        .puzzle-box {
            background: #1e1e24;
            border: 2px solid var(--tiktok-pink);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            box-shadow: 0 0 20px rgba(254, 9, 121, 0.5);
        }
        .puzzle-icon { font-size: 60px; margin-bottom: 10px; }
        .puzzle-title { font-size: 22px; font-weight: bold; color: var(--tiktok-cyan); margin-bottom: 10px; }
        .puzzle-desc { font-size: 18px; line-height: 1.4; margin-bottom: 20px; }
        
        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid var(--tiktok-cyan);
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }
        .btn-action {
            background: var(--tiktok-pink);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .close-btn {
            background: #555;
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 20px;
        }

        .win-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #fe0979, #00f2fe);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="phone-mockup">
    <div class="header" id="room-header">חדר 1: סטודיו הריקוד 🎬</div>
    
    <div class="room-viewport" id="room-viewport">
        <!-- החפצים בחדר שניתן ללחוץ עליהם יופיעו כאן -->
    </div>

    <!-- חלון החידה הקופץ -->
    <div class="puzzle-modal" id="puzzle-modal">
        <div class="puzzle-box">
            <div class="puzzle-icon" id="p-icon">🔎</div>
            <div class="puzzle-title" id="p-title">שם החפץ</div>
            <div class="puzzle-desc" id="p-desc">תיאור החידה...</div>
            
            <input type="text" id="ans-input" placeholder="הקלידו פתרון...">
            <br>
            <button class="btn-action" onclick="checkPuzzleAnswer()">פתיחת המנעול 🔓</button>
            <br>
            <button class="btn-action close-btn" onclick="closePuzzle()">חזרה לסיור בחדר 🔙</button>
        </div>
    </div>

    <!-- מסך ניצחון -->
    <div class="win-screen" id="win-screen">
        <h1 style="font-size: 45px;">🏆 יצאתן מהאחוזה! 🏆</h1>
        <p style="font-size: 22px;">ליאור ומילי, פתרתן את כל החפצים והחידות כמו מקצועניות!</p>
        <div style="font-size: 80px;">✨👑📱</div>
    </div>
</div>

<script>
    // מבנה החדרים והחפצים הפיזיים בתוכם
    const gameData = [
        {
            roomName: "חדר 1: סטודיו הריקוד 🎬",
            bg: "linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1518834107812-67b0b7c58434?w=500')",
            objects: [
                {
                    name: "🖥️ מסך המחשב של הסטרימר",
                    icon: "💻",
                    title: "מחשב העריכה נעול!",
                    desc: "על המסך מופיע סרטון טיק-טוק בלופ עם רמז: <br><br><b>'אני יכול לרוץ אבל אין לי רגליים, יש לי ערוץ אבל אין לי טלוויזיה'. מי אני?</b>",
                    answers: ["נהר", "נחל", "מים"]
                },
                {
                    name: "🚪 דלת היציאה לחדר הבא",
                    icon: "🔒",
                    title: "הדלת נעולה בתיבת קוד!",
                    desc: "כדי לפתוח את הדלת לחדר הבא, פתרו קודם את החידה במסך המחשב!",
                    locked: true
                }
            ]
        },
        {
            roomName: "חדר 2: ארון התלבושות 👗",
            bg: "linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=500')",
            objects: [
                {
                    name: "📦 קופסת נעלי הניאון הסודית",
                    icon: "👟",
                    title: "פתק בתוך נעל הניאון!",
                    desc: "מצאתן פתק סודי: <br><br><b>'משהו שאם אומרים את השם שלו – הוא נעלם פתאום'. מה זה?</b>",
                    answers: ["שקט", "השקט"]
                }
            ]
        },
        {
            roomName: "חדר 3: כספת זהב 🏆",
            bg: "linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500')",
            objects: [
                {
                    name: "🔐 כספת הפרסים המרכזית",
                    icon: "💎",
                    title: "מנעול הטיקטוק האחרון!",
                    desc: "הגעתן לכספת! <br><br><b>'אני מלא בחורים, אבל עדיין מחזיק מים'. מה אני?</b>",
                    answers: ["ספוג", "הספוג"]
                }
            ]
        }
    ];

    let currentRoomIndex = 0;
    let currentObject = null;

    function renderRoom() {
        const room = gameData[currentRoomIndex];
        document.getElementById('room-header').innerText = room.roomName;
        const viewport = document.getElementById('room-viewport');
        viewport.style.backgroundImage = room.bg;
        viewport.innerHTML = "";

        room.objects.forEach(obj => {
            const div = document.createElement('div');
            div.className = 'interactive-object';
            div.innerText = obj.name;
            div.onclick = () => openPuzzle(obj);
            viewport.appendChild(div);
        });
    }

    function openPuzzle(obj) {
        currentObject = obj;
        document.getElementById('p-icon').innerText = obj.icon;
        document.getElementById('p-title').innerText = obj.title;
        document.getElementById('p-desc').innerHTML = obj.desc;
        document.getElementById('ans-input').value = "";
        document.getElementById('puzzle-modal').style.display = 'flex';
    }

    function closePuzzle() {
        document.getElementById('puzzle-modal').style.display = 'none';
    }

    function checkPuzzleAnswer() {
        const input = document.getElementById('ans-input').value.trim();
        if (currentObject.answers && currentObject.answers.some(a => input.includes(a))) {
            alert("כל הכבוד! החפץ נפתח! 🎉");
            closePuzzle();
            currentRoomIndex++;
            if (currentRoomIndex < gameData.length) {
                renderRoom();
            } else {
                document.getElementById('room-viewport').style.display = 'none';
                document.getElementById('puzzle-modal').style.display = 'none';
                document.getElementById('win-screen').style.display = 'flex';
            }
        } else {
            alert("קוד שגוי! נסו לחשוב שוב... 🤔");
        }
    }

    renderRoom();
</script>
</body>
</html>
